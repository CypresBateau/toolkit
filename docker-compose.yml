services:

  # ── 统一推理网关（唯一对外入口）─────────────────────────────────────────────
  gateway:
    build: ./gateway
    image: toolkit-gateway:latest
    container_name: toolkit-gateway
    ports:
      - "9000:9000"                  # 只有这一个端口对外暴露
    environment:
      - TOTAL_GPU_MB=40000           # ← 改成你的 GPU 总显存（MB）
    volumes:
      - ./gateway/tools:/app/tools:ro  # 新增工具只需在宿主机加 config.yaml，无需重建
    networks:
      - toolnet
    depends_on:
      - mavl
      - mvfa-ad
      - tool-unit
      - tool-mdcalc
      - tool-skills
    restart: unless-stopped

  # ── MAVL（B 类，独立环境）────────────────────────────────────────────────────
  mavl:
    build:
      context: ./MAVL
      dockerfile: serving/Dockerfile.serving
    image: mavl-serving:latest
    container_name: mavl-serving
    expose:
      - "8000"                       # 仅内网可达，外部无法直接访问
    volumes:
      - /data/wxb/toolkit/MAVL:/workspace/MAVL
      - /home/tx/.cache/huggingface:/root/.cache/huggingface
      - /home/tx/.cache/torch:/root/.cache/torch
    env_file:
      - ./MAVL/serving/.env
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - toolnet
    restart: unless-stopped


  # —— MVFA-AD ———————————————————————————————————————————————————————————————
  mvfa-ad:
    build:
      context: ./MVFA-AD
      dockerfile: serving/Dockerfile.serving
    image: mvfa-ad-serving:latest
    container_name: mvfa-ad-serving
    expose:
      - "8000"
    volumes:
      - /data/wxb/toolkit/MVFA-AD:/workspace/MVFA-AD
      - /home/tx/.cache/torch:/root/.cache/torch
    env_file:
      - ./MVFA-AD/serving/.env
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - toolnet
    restart: unless-stopped


  # ── 医疗评分计算器（44 个，纯 CPU，已废弃）──────────────────────────────────
  # tool-scale:
  #   build: ./med-calc
  #   image: med-calc:latest
  #   container_name: tool-scale
  #   expose:
  #     - "8000"
  #   environment:
  #     - TOOL_JSON_PATH=/data/tool_scale.json
  #     - TOOL_CATEGORY=scale
  #   volumes:
  #     - /data/wxb/toolkit/tool_scale.json:/data/tool_scale.json:ro
  #   networks:
  #     - toolnet
  #   restart: unless-stopped

  # ── 医学单位换算工具（237 个，纯 CPU）────────────────────────────────────────
  tool-unit:
    build: ./med-calc
    image: med-calc:latest
    container_name: tool-unit
    expose:
      - "8000"
    environment:
      - TOOL_JSON_PATH=/data/tool_unit_metadata.json
      - TOOL_CATEGORY=unit
    volumes:
      - /data/wxb/toolkit/tool_unit_metadata.json:/data/tool_unit_metadata.json:ro
    networks:
      - toolnet
    restart: unless-stopped

  # ── MDCalc 医疗计算器（871 个，纯 CPU）────────────────────────────────────────
  tool-mdcalc:
    build: ./mdcalc
    image: mdcalc:latest
    container_name: tool-mdcalc
    expose:
      - "8000"
    environment:
      - TOOL_JSON_PATH=/data/tools_metadata.json
    volumes:
      - /data/wxb/toolkit/tools_metadata.json:/data/tools_metadata.json:ro
    networks:
      - toolnet
    restart: unless-stopped

  # ── Skills 服务（纯 CPU）────────────────────────────────────────────────────
  tool-skills:
    build: ./skills
    image: tool-skills:latest
    container_name: tool-skills
    expose:
      - "8000"
    environment:
      - TOOL_JSON_PATH=/data/skills_metadata.json
    volumes:
      - /data/wxb/toolkit/skills_metadata.json:/data/skills_metadata.json:ro
    networks:
      - toolnet
    restart: unless-stopped

  # ── MToolHub 语义路由层（自然语言 → 工具/模型调度）────────────────────────────
  mtoolhub:
    build:
      context: ./MToolHub/backend
      dockerfile: Dockerfile
    image: mtoolhub:latest
    container_name: mtoolhub
    ports:
      - "8081:8080"                  # 对外暴露对话接口
    environment:
      - GATEWAY_BASE_URL=http://toolkit-gateway:9000  # 指向已有 gateway
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_MODEL=claude-sonnet-4-20250514
      # - EMBEDDING_MODEL=/app/models/S-PubMedBert-MS-MARCO  # 英文模型（本地挂载）
      - EMBEDDING_MODEL=/app/models/bge-m3  # 中英文多语言模型（本地挂载）
      - EMBEDDING_DEVICE=cpu
      - DIRECT_CALL_THRESHOLD=0.85
      - CLAUDE_SELECT_THRESHOLD=0.60
    volumes:
      - ./MToolHub/backend/data:/app/data
      - ./skills:/app/skills:ro      # 技能目录（需确认路径）
      - /data/wxb/models/bge-m3:/app/models/bge-m3:ro
    networks:
      - toolnet
    restart: unless-stopped

networks:
  toolnet:
    driver: bridge
